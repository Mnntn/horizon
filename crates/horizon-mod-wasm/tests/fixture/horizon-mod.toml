id = "wasm_fixture"
name = "Wasm fixture"
version = "0.1.0"
description = "Minimal shared-memory wasm fixture."
api = "0.2"
side = "both"
capabilities = ["registries"]

[[inject]]
id = "tick"
at = "horizon_client::game::Game<'_>::tick"
kind = "head"
with = "on_tick"
access = "api"
hash = "fixture"

[[inject]]
id = "shutdown"
at = "horizon_client::game::server_lifecycle::remember_shutdown"
kind = "head"
with = "on_shutdown"
access = "api"
hash = "fixture"

[[inject]]
id = "average"
at = "horizon_client::game::beacon::average"
kind = "replace"
with = "own_average"
access = "api"
hash = "fixture"
